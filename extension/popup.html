  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #272727;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .logo-icon {
      font-size: 24px;
      color: #ff0000;
    }
    h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
    }
    .dev-badge {
      font-size: 10px;
      color: #ff4444;
      font-weight: 600;
      display: block;
    }
    .status-card {
      background: #181818;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-online {
      background-color: rgba(46, 125, 50, 0.2);
      color: #4caf50;
      border: 1px solid #2e7d32;
    }
    .status-offline {
      background-color: rgba(198, 40, 40, 0.2);
      color: #f44336;
      border: 1px solid #c62828;
    }
    .btn-action {
      display: block;
      width: 100%;
      padding: 10px;
      background: #ff0000;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #cc0000;
    }
    p {
      font-size: 11px;
      color: #aaa;
      line-height: 1.4;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    .footer-credits {
      border-top: 1px solid #222;
      padding-top: 8px;
      margin-top: 10px;
      text-align: center;
      font-size: 10px;
      color: #777;
    }
    .footer-credits a {
      color: #ff4444;
      text-decoration: none;
    }
  </style>
</head>
<body>

</html>
